[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dependency-sentinel"
version = "0.1.0"
description = "Scheduled, async enterprise dependency-triage agent"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Brian Pelow" }]
dependencies = [
    "httpx>=0.27.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
daemon = [
    "apscheduler>=3.10.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["C408", "BLE001", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]